(()=>{

const BARRIERS=[['self','还不了解自己'],['job','不了解岗位日常'],['conflict','几个选择难取舍'],['outside','自己与家人期待不同'],['skill','不知道怎么补能力'],['none','暂无明显阻碍']];

const SOURCES=[['like','一直感兴趣'],['done','有过相关经历'],['curious','还没试过，想体验']];
const TASKS={
 I:{title:'报名更多了，为什么到场更少？',story:'社团迎新活动结束了。负责人把两期数据交给你，想听听你的第一步。',question:'你会先怎么做？',options:[['check','先比较报名率和到场率','把现象与原因分开，再找流失环节'],['ask','找没到场的同学聊一聊','先了解他们没来的具体原因'],['promote','先增加一次活动宣传','看看更多触达能否带来变化'],['unsure','我还没想好','想先看一个示例']],prompt:'可选：用一句话写下你的判断或想追问的问题。',evidence:{check:'选择先比较数据指标',ask:'选择先了解未到场者的原因',promote:'选择先尝试增加触达',unsure:'想先借助示例理解任务'}},
 A:{title:'把普通的一天，变成一句邀请。',story:'创意工坊正在招募伙伴。它开放给所有专业，周三晚可以体验摄影、手作与海报设计。',question:'你想从哪个角度发出邀请？',options:[['story','从一个真实的小故事切入','让新同学看到一个熟悉的自己'],['benefit','说清能体验什么','让人快速知道是否感兴趣'],['visual','先设计一个视觉主题','用画面和氛围传达想法'],['unsure','我还没想好','想先看一个示例']],prompt:'可选：写一句你会放在海报上的邀请文案。',evidence:{story:'选择故事表达作为创作起点',benefit:'选择清楚呈现活动价值',visual:'选择用视觉主题表达',unsure:'想先借助示例理解任务'}},
 S:{title:'有位新同学，还站在门外。',story:'一位同学来到社团招新处，却说：“我好像什么都不擅长，还是算了。”',question:'你会怎样开启这段对话？',options:[['listen','先问他担心的是什么','给对方表达真实顾虑的空间'],['invite','邀请他体验一个小任务','从低压力的体验开始'],['explain','介绍社团里不同的角色','提供信息，让他自己选择'],['unsure','我还没想好','想先看一个示例']],prompt:'可选：写下你想对这位同学说的第一句话。',evidence:{listen:'选择先倾听具体顾虑',invite:'选择低压力体验来提供支持',explain:'选择补充角色信息',unsure:'想先借助示例理解任务'}},
 E:{title:'活动就要开始，伙伴意见却不同。',story:'团队一半想办线下市集，一半想办线上征集。人手有限，这周只能先做一个。',question:'你想怎样推动下一步？',options:[['align','先对齐这次活动的目标','让比较围绕同一个问题'],['trial','各拿出一个最小方案','比较成本，再选可行的尝试'],['talk','分别听听两边的理由','找到意见背后的真实需求'],['unsure','我还没想好','想先看一个示例']],prompt:'可选：写一句你会在讨论中提出的问题。',evidence:{align:'选择先对齐团队目标',trial:'选择比较小方案的可行性',talk:'选择先理解不同立场',unsure:'想先借助示例理解任务'}},
 C:{title:'三张报名表，三个不同版本。',story:'活动名单散在三个群里，有人重复报名，有人改了时间。明天就要通知到场。',question:'你会从哪里开始整理？',options:[['merge','先合并名单，检查重复','建立一个可核对的版本'],['confirm','先确认截止时间和负责人','让后续更新有清楚的规则'],['track','列出还没确认的事项','优先处理影响通知的问题'],['unsure','我还没想好','想先看一个示例']],prompt:'可选：写下你认为最需要核对的一项信息。',evidence:{merge:'选择先整理和核对信息',confirm:'选择先明确流程责任',track:'选择按未决事项推进',unsure:'想先借助示例理解任务'}},
 R:{title:'展示装置，突然不工作了。',story:'你们做的互动灯光装置在彩排时停止响应。距离正式展示还有一小时，现场有说明书和备用零件。',question:'你会先怎么处理？',options:[['isolate','先安全断电，再分段检查','逐步缩小故障范围'],['manual','先查说明书和连接方式','依据已有资料定位问题'],['backup','先准备一个简化展示方案','保障活动能继续进行'],['unsure','我还没想好','想先看一个示例']],prompt:'可选：写下你想先核实的一个问题。',evidence:{isolate:'选择安全检查并分段排查',manual:'选择先查阅资料核对',backup:'选择准备可用的备用方案',unsure:'想先借助示例理解任务'}}
};
const ROLES=[
{id:'product',name:'产品经理 / 产品助理',i:{I:5,E:4,C:2,A:2},v:['growth','independence'],daily:'了解用户问题，梳理需求，与团队验证解决方案。',gap:'仍需验证问题定义、需求取舍和跨团队协作。',action:'选择一个校园问题，写 3 个访谈问题，再找一位同学聊聊。'},
{id:'operations',name:'用户运营',i:{S:4,E:4,I:3,C:2},v:['relationships','growth'],daily:'了解用户需求，组织活动，跟进反馈与参与情况。',gap:'仍需体验持续跟进、指标复盘与沟通协调。',action:'用一次真实校园活动做一页复盘：现象、可能原因、下次验证。'},
{id:'data',name:'数据分析',i:{I:5,C:4,R:1},v:['growth','independence'],daily:'整理数据，明确指标，分析现象并解释结果。',gap:'仍需验证数据工具、指标口径与分析表达。',action:'找一份公开小数据集，提出一个问题并画一张能回答它的图。'},
{id:'content',name:'内容策划',i:{A:5,E:3,S:2},v:['recognition','independence'],daily:'理解受众，策划选题，创作并复盘内容。',gap:'仍需体验持续创作、修改和传播反馈。',action:'为一个校园活动写两版邀请文案，请两位同学反馈差别。'},
{id:'design',name:'视觉 / 交互设计',i:{A:5,I:3,R:2},v:['independence','growth'],daily:'用视觉或交互方案表达信息、解决使用问题。',gap:'仍需验证设计基础、工具使用与方案迭代。',action:'选一个不清楚的校园指示或页面，提出一版改进草图。'},
{id:'success',name:'客户成功 / 用户支持',i:{S:5,E:3,C:2},v:['relationships','support'],daily:'了解使用困难，协助解决问题并整理用户反馈。',gap:'仍需体验持续沟通、边界管理和问题追踪。',action:'观察一位同学使用一个工具，记录三个真实卡点。'},
{id:'business',name:'商务拓展',i:{E:5,S:3},v:['recognition','relationships'],daily:'寻找合作机会，理解双方需求并推进沟通。',gap:'仍需验证价值表达、合作判断与持续跟进。',action:'为校园活动拟一份合作邀请，说明对方能获得什么。'},
{id:'project',name:'项目协调 / 项目助理',i:{C:5,E:3,S:2},v:['support','conditions'],daily:'跟踪事项、协调进度、整理交付与变更。',gap:'仍需验证多任务处理、风险识别与实际协作。',action:'把一个小项目整理成任务、负责人、截止时间三列清单。'},
{id:'developer',name:'软件开发',i:{I:5,R:4,C:2},v:['growth','independence'],daily:'理解需求，编写、调试和维护软件。',gap:'需要进一步了解专业基础、编程经历和调试作品。',action:'用熟悉的工具做一个能解决校园小问题的最小程序。'},
{id:'technical',name:'技术支持 / 实验技术',i:{R:5,I:3,C:3},v:['conditions','support'],daily:'操作与维护设备，排查故障，记录实验或技术过程。',gap:'需要进一步核实具体行业、专业资格与安全要求。',action:'在有指导和安全条件的课程实验中，整理一份操作与排查记录。'}
];
function initial(){return {version:VERSION,view:'home',step:0,finished:false,goal:'',grade:'',major:'',target:'',interests:[],source:'',taskChoice:'',taskText:'',taskDomain:'',taskHelp:false,values:[],environment:'',adapt:'',confidence:'',barrier:'',budget:'',timeline:'',city:'',question:'',consent:false};}
function lookup(list,key,fallback='待了解'){return list.find(x=>x[0]===key)?.[1]??fallback;}
function sanitize(raw){const s=initial();if(!raw||raw.version!==VERSION)return s;for(const k of ['major','target','taskText','city','question'])s[k]=typeof raw[k]==='string'?raw[k].slice(0,k==='question'?500:k==='taskText'?200:60):'';for(const [k,ls] of Object.entries({goal:GOALS,source:SOURCES,environment:ENVS,adapt:ADAPT,barrier:BARRIERS,budget:BUDGETS,timeline:TIMELINES}))if(ls.some(x=>x[0]===raw[k]))s[k]=raw[k];s.grade=GRADES.includes(raw.grade)?raw.grade:'';s.interests=Array.isArray(raw.interests)?[...new Set(raw.interests)].filter(x=>INTERESTS.some(y=>y[0]===x)).slice(0,2):[];s.values=Array.isArray(raw.values)?[...new Set(raw.values)].filter(x=>VALUES.some(y=>y[0]===x)).slice(0,2):[];s.taskDomain=s.interests[0]||'';if(TASKS[s.taskDomain]?.options.some(x=>x[0]===raw.taskChoice)&&raw.taskDomain===s.taskDomain)s.taskChoice=raw.taskChoice;else s.taskText='';s.taskHelp=raw.taskHelp===true&&raw.taskDomain===s.taskDomain;s.confidence=['1','2','3','4','5','unsure'].includes(String(raw.confidence))?String(raw.confidence):'';s.step=Number.isInteger(raw.step)?Math.max(0,Math.min(5,raw.step)):0;s.finished=raw.finished===true&&[0,1,2,3,4,5].every(i=>validStep(s,i));s.view=s.finished&&['result','expert'].includes(raw.view)?'result':['home','story'].includes(raw.view)?raw.view:'home';return s;}
function validStep(s,n){return [!!s.goal,s.interests.length>0,!!s.taskChoice,s.values.length>0&&!!s.environment,!!s.adapt&&!!s.confidence&&!!s.barrier,!!s.timeline&&!!s.budget][n]??false;}
function rank(s){if(!s.interests.length)return [];let rows=ROLES.map(role=>{const interest=s.interests.reduce((v,i)=>v+(role.i[i]||0),0)/(s.interests.length*5);const value=s.values.length?s.values.filter(v=>role.v.includes(v)).length/s.values.length:0;const signal=.7*interest+.3*value;return {...role,signal,weight:Math.pow(.1+signal,3)}});const total=rows.reduce((n,r)=>n+r.weight,0);rows=rows.map(r=>({...r,exact:100*r.weight/total}));rows.sort((a,b)=>b.exact-a.exact||a.id.localeCompare(b.id));rows.forEach(r=>r.percent=Math.floor(r.exact));const remaining=100-rows.reduce((n,r)=>n+r.percent,0);const rem=[...rows].sort((a,b)=>(b.exact-b.percent)-(a.exact-a.percent));for(let i=0;i<remaining;i++)rem[i].percent++;return rows;}
function profile(s){const task=TASKS[s.interests[0]];const confidence=s.confidence==='unsure'?'完成信心暂不确定':s.confidence?`自评完成信心 ${s.confidence}/5`:'信心尚待了解';return [
{name:'职业兴趣',value:s.interests.map(x=>lookup(INTERESTS,x)).join('、')||'待探索',note:s.source?lookup(SOURCES,s.source):'活动偏好线索，尚未覆盖真实工作'},
{name:'工作价值观',value:s.values.map(x=>lookup(VALUES,x)).join('、')||'待了解',note:'本次选择的优先条件'},
{name:'技能与经历',value:s.taskText.trim()?'有一段任务思路，待核实':s.source==='done'?'自述有相关经历，待补充':'尚无充分作品证据',note:s.taskChoice?(task?.evidence[s.taskChoice]||'情境选择仅作为线索')+(s.taskHelp?' · 看过示例':''):'情境选择不能等同能力'},
{name:'工作环境偏好',value:lookup(ENVS,s.environment),note:'应在具体团队中进一步核实'},
{name:'自我效能与预期',value:confidence,note:s.goal?`期待：${lookup(GOALS,s.goal)}；任务结果预期待追问`:'任务信心与实际能力分开理解'},
{name:'生涯适应资源',value:lookup(ADAPT,s.adapt),note:'一次变化应对线索；其余适应资源待了解'},
{name:'决策与咨询难点',value:lookup(BARRIERS,s.barrier),note:s.question?`想问：${s.question}`:lookup(GOALS,s.goal,'咨询诉求待了解')},
{name:'现实条件与目标',value:`${lookup(TIMELINES,s.timeline)} · ${lookup(BUDGETS,s.budget)}`,note:[s.grade,s.major,s.city?`地点：${s.city}`:'地点尚未限定',s.target?`关注：${s.target}`:''].filter(Boolean).join(' · ')}
];}
function handoffText(s){const top=rank(s).slice(0,3);return `我的职业咨询摘要\n\n当前背景：${[s.grade,s.major].filter(Boolean).join(' · ')||'在校大学生，年级专业待补充'}\n最想解决：${lookup(GOALS,s.goal)}\n关注方向：${s.target||'尚未确定'}\n\n${profile(s).map(p=>`${p.name}：${p.value}\n  依据／待了解：${p.note}`).join('\n')}\n\n候选探索方向：${top.map(r=>r.name+' '+r.percent+'%').join('；')}\n百分比为 10 个演示候选方向内的相对推荐权重，非真实适配或录用概率。\n\n我的任务思路：${s.taskText||'暂未填写，能力需要进一步验证'}\n\n最想向专家提问：${s.question||`我想${lookup(GOALS,s.goal)}，请帮我核实这些方向，并找到适合当前时间预算的下一步。`}`;}

const EMBEDDED=window.parent!==window,ATTEMPT=new URLSearchParams(location.search).get('attempt')||'';
const app=document.querySelector('#app'),journal=document.querySelector('#journal'),KEY=EMBEDDED?'careerfly-campus-progress-v1':'summer-campus-local-progress-v1';
let state=initial(),toastTimer,transferred=null,customDraft='';
try{const previous=JSON.parse(localStorage.getItem(KEY));state=EMBEDDED&&previous?.attempt!==ATTEMPT?initial():sanitize(previous)}catch{}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
function save(){try{localStorage.setItem(KEY,JSON.stringify({...state,consent:false,attempt:ATTEMPT}))}catch{}}
function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2700)}
function choose(field,value,multi=false){if(multi){const a=state[field];if(a.includes(value))state[field]=a.filter(x=>x!==value);else if(a.length<2)state[field]=[...a,value];else {toast('最多选两项。可以先取消一项，再换一个。');return}}else state[field]=value;if(field==='interests'&&state.taskDomain!==state.interests[0]){state.taskDomain=state.interests[0]||'';state.taskChoice='';state.taskText='';state.taskHelp=false}if(field==='taskChoice'&&value==='unsure')state.taskHelp=true;state.consent=false;transferred=null;state.finished=state.finished&&[0,1,2,3,4,5].every(i=>validStep(state,i));save();renderStory(false)}
function options(field,items,multi=false,two=false){return `<div class="choices${two?' two':''}">${items.map(([id,title,desc,symbol])=>{const on=multi?state[field].includes(id):state[field]===id;return `<button type="button" class="option ${on?'selected':''}" data-field="${field}" data-value="${esc(id)}" ${multi?'data-multi="true"':''} aria-pressed="${on}">${symbol?`<span class="symbol" aria-hidden="true">${symbol}</span>`:''}<span><strong>${esc(title)}</strong>${desc?`<small>${esc(desc)}</small>`:''}</span><span class="check" aria-hidden="true">${on?'✓':'○'}</span></button>`}).join('')}</div>`}
function chips(field,items,multi=false){return `<div class="chips">${items.map(([id,title])=>{const on=multi?state[field].includes(id):state[field]===id;return `<button type="button" class="chip ${on?'selected':''}" data-field="${field}" data-value="${esc(id)}" ${multi?'data-multi="true"':''} aria-pressed="${on}">${esc(title)}</button>`}).join('')}</div>`}
function input(field,placeholder,max=60){return `<input class="text-input" data-input="${field}" id="${field}" value="${esc(state[field])}" placeholder="${esc(placeholder)}" maxlength="${max}">`}

function renderHome(){sceneArt(true);state.view='home';document.body.classList.remove('result-mode');app.innerHTML=`<section class="home"><div class="home-copy"><span class="small-pill">一场关于未来的校园漫游</span><h1>故事刚开始，<br>未来由你落笔。</h1><p>走过熟悉的校园，<br>发现那些藏在选择里的职业线索。</p></div><div class="postcard"><span class="stamp">CAMPUS<br>INVITATION</span><span class="eyebrow">致 · 正在寻找方向的你</span><h2>一份校园项目邀请，<br>想请你一起完成。</h2><p>跟着小夏走六站，整理你喜欢的事、<br>在意的事和真正想问专家的问题。</p><div class="route-preview">社团广场 → 创意工坊 → 图书馆<br>收集职业线索 · 遇见专属数字人专家</div><button class="primary full" id="start">${state.finished?'打开我的探索画像':state.goal?'继续我的校园故事':'收下邀请，出发'} <span class="arrow">→</span></button><p class="subnote">约 4 分钟 · 进度仅保存在本机</p>${state.goal?'<button class="text-button full" id="restart">重新开始一段故事</button>':''}</div><div class="pin">社团广场 · 新的故事正在发生</div><div class="home-companion"><div class="home-greeting"><div class="guide-label"><b>小夏</b> 你的校园同行者</div><p>嗨，新同学！<br>一起发现你喜欢的事吧。</p></div></div><div class="home-footer"><span><strong>每一个选择，都让未来更清楚一点。</strong>没有标准人生，只有更值得尝试的下一步。</span><span>01 / 夏日的邀请</span></div></section>`;$('#start').onclick=()=>{if(state.finished)renderResults();else{state.view='story';save();renderStory()}};if($('#restart'))$('#restart').onclick=restart;save()}
function renderStory(focus=true){sceneArt(true);state.view='story';document.body.classList.remove('result-mode');const n=state.step,[place,title,subtitle,quote,english]=SCENES[n],oldScroll=$('.panel-content')?.scrollTop||0;app.innerHTML=`<section class="game"><div class="scene-area"><div class="scene-caption"><span class="eyebrow">0${n+1} / ${english}</span><h1>${title}</h1><p>${subtitle}</p></div><div class="scene-companion"><div class="scene-guide"><div class="guide-label"><b>小夏</b> 你的校园同行者</div><p>“${quote}”</p></div><div class="trail" aria-label="探索进度">${SCENES.map((x,i)=>`<span class="${i===n?'current':i<n?'done':''}" title="${x[0]}">${i<n?'✓':i+1}</span>`).join('')}</div></div></div><section class="task-panel"><div class="panel-top"><div class="progress-meta"><span>${place}</span><span>${n+1} / 6 · ${n===5?'最后一站':`还有 ${5-n} 站`}</span></div><div class="progress-track" role="progressbar" aria-label="已到达站点" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${n+1}"><div class="progress-fill" style="width:${(n+1)/6*100}%"></div></div></div><div class="panel-content">${screen(n)}</div><div class="panel-footer"><button class="text-button" id="back">← ${n===0?'返回校园':'上一站'}</button><button class="primary" id="next" ${validStep(state,n)?'':'disabled'}>${n===5?'打开我的探索画像':'去'+SCENES[n+1][0]} <span class="arrow">→</span></button></div></section></section>`;app.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{const field=b.dataset.field,value=b.dataset.value;choose(field,value,b.dataset.multi==='true');app.querySelector(`[data-field="${field}"][data-value="${CSS.escape(value)}"]`)?.focus({preventScroll:true})});app.querySelectorAll('[data-input]').forEach(el=>{const cb=()=>{state[el.dataset.input]=el.value;state.consent=false;transferred=null;save()};el.addEventListener('input',cb);el.addEventListener('change',cb)});$('#back').onclick=()=>{if(n===0)renderHome();else{state.step--;save();renderStory()}};$('#next').onclick=next;$('.panel-content').scrollTop=focus?0: function reason(role){const strongest=[...state.interests].sort((a,b)=>(role.i[b]||0)-(role.i[a]||0))[0],vals=state.values.filter(x=>role.v.includes(x));if(!(role.i[strongest]>0))return '当前兴趣线索与这个方向的联系较少，可以在获得更多经历后再讨论。';return `你选择了“${lookup(INTERESTS,strongest)}”${vals.length?`，也在意“${lookup(VALUES,vals[0])}”`:''}，值得从这个方向做一次体验。`}

function renderResults(){if(![0,1,2,3,4,5].every(i=>validStep(state,i))){state.step=[0,1,2,3,4,5].find(i=>!validStep(state,i))??0;renderStory();return}sceneArt(false);state.view='result';state.finished=true;document.body.classList.add('result-mode');const ranked=rank(state),top=ranked[0],entries=profile(state);app.innerHTML=`<section class="results-shell"><div class="results-heading"><div><span class="eyebrow">YOUR NEXT CHAPTER</span><h1>原来，未来已经有了些线索。</h1><p>这是一张可以继续修改的探索地图。你仍然拥有选择的主动权。</p></div><button class="quiet" id="edit">↶ 回看与修改</button></div><div class="results-grid"><section class="results-card"><span class="badge">6 站完成 · 八维线索档案</span><h2 style="margin-top:13px">现在的你，值得被这样了解</h2><div class="card-sub">偏好来自你的回答；能力与长期适应性仍需要更多证据。</div><div class="profile-grid">${entries.map(p=>`<div class="profile-item"><label>${p.name}</label><strong>${esc(p.value)}</strong><small>${esc(p.note)}</small></div>`).join('')}</div><div class="profile-footer">${state.target?`你关注的“${esc(state.target)}”会保留给专家讨论，即使它不在本次候选列表中。`:'未填写的信息会保留为空，不替你猜测。'}<br><button class="text-button" id="basis">了解画像依据 ↗</button></div></section><section class="results-card"><span class="badge orange">值得先体验 · 非职业定论</span><h2 style="margin-top:13px">可能适配的岗位方向</h2><div class="card-sub">按本次兴趣与价值取舍排序 · 百分比为相对推荐权重</div>${ranked.slice(0,3).map(rankCard).join('')}<details class="rank-detail"><summary>展开其余 ${ranked.length-3} 个候选方向（共 ${ranked.slice(3).reduce((n,r)=>n+r.percent,0)}%）</summary>${ranked.slice(3).map((r,i)=>rankCard(r,i+3)).join('')}</details><details class="method"><summary>这些百分比代表什么？</summary><p>它们表示本次 10 个演示候选方向中的相对推荐权重，合计 100%。不是你真正适合某职业的概率，也不是录用概率。规则综合活动兴趣与价值取舍，尚未做统计校准；没有把未验证的能力、专业门槛或现实岗位条件算成已满足。</p><p>当前候选范围有限。具体岗位、团队和市场机会应由专家结合你的专业与作品进一步核实；相近权重不代表明确优劣。</p></details><div class="hint"><strong>如果先试一小步</strong><br>${esc(top.action)}<br><small>${state.budget==='small'?'按你的时间，先用 15–20 分钟做一个草稿即可。':state.budget==='unknown'?'先选一个 15 分钟的小动作，再确认时间预算。':'先做一个小成果，再决定是否继续投入。'}</small></div></section></div><section class="expert-banner"><div><span class="eyebrow">LET’S TALK ABOUT YOUR NEXT STEP</span><h2>找你的专属数字人专家继续聊聊吧</h2><p>从这份画像出发，聊聊你真正纠结的问题。</p><label class="consent"><input type="checkbox" id="consent" ${state.consent?'checked':''}>我已核对，愿意把本次画像、任务思路和咨询问题带到接待页</label></div><button class="primary" id="expert" ${state.consent?'':'disabled'}>去见我的专属专家 <span class="arrow">→</span></button></section></section>`;$('#edit').onclick=showJournal;$('#basis').onclick=showBasis;$('#consent').onchange=e=>{state.consent=e.target.checked;$('#expert').disabled=!state.consent};$('#expert').onclick=()=>{if(!state.consent)return;transferred=handoffText(state);customDraft=state.question||`我想${lookup(GOALS,state.goal)}，请帮我比较${ranked[0].name}和${ranked[1].name}，找到下一步。`;renderExpert()};window.scrollTo(0,0);save();publishProfile()}
function renderExpert(){if(!transferred){renderResults();return}sceneArt(false);state.view='expert';document.body.classList.add('result-mode');const title=state.goal==='intern'?'实习规划顾问':state.goal==='plan'?'生涯成长顾问':'职业探索顾问';app.innerHTML=`<section class="reception"><button class="text-button" id="return-result">← 返回我的探索画像</button><span class="eyebrow" style="display:block;margin-top:15px">YOUR PERSONAL CAREER CONVERSATION</span><h1 class="reception-top">故事继续，从一个好问题开始。</h1><div class="reception-layout"><aside class="results-card expert-intro"><div class="monogram" aria-hidden="true">✳</div><span class="badge">专属数字人专家 · 接待页</span><h2 style="margin-top:16px">${title}</h2><p>这次，我们从你已经整理好的线索出发，不用再重复介绍自己。</p><ul><li>核实兴趣与真实经历</li><li>比较方向与现实条件</li><li>制定一项可验证的行动</li></ul><p class="card-sub">演示角色，尚未接入实时数字人服务。当前只整理咨询材料，不生成或发送专家答复。</p></aside><section class="results-card"><span class="chat-label">接待提示 · 本地演示</span><div class="chat-bubble">你的探索摘要已经准备好。<br>${state.barrier==='none'?'接下来可以从你最想解决的目标聊起。':`接下来最值得聊清楚的，是“${esc(lookup(BARRIERS,state.barrier))}”。`}先核对带来的信息，再把想问的问题写清楚。</div><label class="field-label" for="expert-question">想从哪个问题开始？</label><textarea id="expert-question" maxlength="500" rows="3">${esc(customDraft)}</textarea><div class="chips" style="margin-top:11px"><button class="chip" data-topic="compare">帮我比较两个方向</button><button class="chip" data-topic="evidence">还需要补充什么证据</button><button class="chip" data-topic="action">安排一个小行动</button></div><details class="rank-detail" style="margin-top:20px"><summary>查看带来的八维画像与任务思路</summary><div class="question-preview" id="handoff-preview">${esc(transferred)}</div></details><div class="reception-actions"><button class="primary" id="copy-summary">复制咨询摘要</button><button class="secondary" id="save-question">保存这次咨询问题</button></div><p class="hint">接待页已就绪，实时对话服务尚未连接。你可以保存问题，或复制摘要用于后续咨询。这里不会显示虚构的专家回复。</p></section></div></section>`;$('#return-result').onclick=renderResults;$('#expert-question').oninput=e=>customDraft=e.target.value;app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{const r=rank(state);customDraft={compare:`我在${r[0].name}与${r[1].name}之间犹豫。请结合我的兴趣、价值取舍和现实条件，帮我理解两者的工作差别。`,evidence:'这些判断还有哪些证据不足？请帮我列出最需要补充的两段经历或作品。',action:`我目前${lookup(BUDGETS,state.budget)}可以投入，${lookup(TIMELINES,state.timeline)}考虑实习或求职。请帮我设计一个能验证方向的小行动。`}[b.dataset.topic];$('#expert-question').value=customDraft;app.querySelectorAll('[data-topic]').forEach(x=>x.classList.toggle('selected',x===b))});$('#save-question').onclick=()=>{if(!customDraft.trim()){toast('先写下一句想问的问题吧。');return}state.question=customDraft.trim();transferred=handoffText(state);$('#handoff-preview').textContent=transferred;save();toast('咨询问题已保存在当前浏览器。')};$('#copy-summary').onclick=async()=>{const copy=transferred+'\n\n本次开场问题：'+customDraft;try{await navigator.clipboard.writeText(copy);toast('已复制，可以粘贴给之后咨询的专家。')}catch{const ta=document.createElement('textarea');ta.value=copy;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'咨询摘要已复制。':'复制未成功，请展开摘要后手动复制。')}};window.scrollTo(0,0);save()}
function showJournal(){const ps=profile(state),map=[1,3,2,3,4,4,4,5];$('#journal-content').innerHTML=state.goal?`<p class="intro">点击对应线索即可回到那一站修改。进度只保存在本机。</p>${ps.map((p,i)=>`<div class="note-row"><strong>${p.name}</strong><span style="float:right"><button class="text-button" data-edit="${map[i]}">修改 ↗</button></span><div>${esc(p.value)}</div><small>${esc(p.note)}</small></div>`).join('')}<div class="note-row"><strong>出发时的目标</strong><button class="text-button" style="float:right" data-edit="0">修改 ↗</button><div>${esc(lookup(GOALS,state.goal))}</div></div><button class="text-button" id="clear-progress" style="margin-top:16px">清除本机进度，重新开始</button>`:'<p class="intro">故事还没开始。收下项目邀请，你的选择会一站一站收进这里。</p>';$('#journal-content').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{journal.close();const requested=Number(b.dataset.edit);state.step=requested===2&&!state.interests.length?1:requested;state.consent=false;transferred=null;renderStory()});if($('#clear-progress'))$('#clear-progress').onclick=restart;journal.showModal()}
function showBasis(){$('#journal-content').innerHTML=`<p class="intro">本游戏借用成熟框架整理线索，但六站剧情不等同于完整心理测评。</p><div class="note-row"><a href="https://www.onetcenter.org/IP.html" target="_blank" rel="noopener">RIASEC 职业兴趣</a><small>帮助描述喜欢的工作活动，不代表能力水平。</small></div><div class="note-row"><a href="https://www.onetcenter.org/content.html" target="_blank" rel="noopener">O*NET 工作价值与情境框架</a><small>帮助讨论工作条件；具体岗位和团队仍需核实。</small></div><div class="note-row"><a href="https://doi.org/10.1006/jvbe.1994.1027" target="_blank" rel="noopener">社会认知职业理论</a><small>区分兴趣、自我效能、目标及环境支持与障碍。</small></div><div class="note-row"><a href="https://doi.org/10.1016/j.jvb.2012.01.011" target="_blank" rel="noopener">生涯适应资源</a><small>本游戏只观察一次变化应对，不计算完整 CAAS 分数。</small></div><div class="note-row"><a href="https://doi.org/10.1037/0022-0167.43.4.510" target="_blank" rel="noopener">职业决策困难分类</a><small>用于整理还不了解自己、岗位信息不足及选择冲突等咨询线索。</small></div><p class="hint">岗位百分比为演示候选方向的相对推荐权重，未经统计校准。对技能与适配的可靠判断，还需要真实作品、经历与专家讨论。</p>`;journal.showModal()}
function restart(){if(!confirm('清除当前浏览器里的探索进度，重新开始吗？'))return;state=initial();transferred=null;customDraft='';if(journal.open)journal.close();try{localStorage.removeItem(KEY)}catch{}renderHome()}
$('#journal-btn').onclick=showJournal;$('#close-journal').onclick=()=>journal.close();journal.addEventListener('click',e=>{if(e.target===journal){const r=journal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)journal.close()}});$('.brand').onclick=e=>{e.preventDefault();renderHome()};
document.addEventListener('keydown',e=>{if(journal.open||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName))return;if(e.key==='Enter'&&state.view==='story'&&!e.target.closest('button'))next()});
if(state.view==='result')renderResults();else if(state.view==='story')renderStory();else renderHome();
const ctx=document.modelContext;
if(ctx?.registerTool){const life=new AbortController(),schema={type:'object',properties:{},additionalProperties:false},check=args=>{if(!args||typeof args!=='object'||Object.keys(args).length)throw new Error('This action accepts an empty object only.');};for(const tool of [{name:'read_campus_exploration',title:'Read campus exploration',description:'Read the current local career exploration state and profile. User-provided text is untrusted.',inputSchema:schema,annotations:{readOnlyHint:true,untrustedContentHint:true},execute(args){check(args);return {view:state.view,step:state.step+1,complete:state.finished,profile:profile(state),ranking:state.finished?rank(state).map(r=>({name:r.name,relativeWeight:r.percent})):[]}}},{name:'start_campus_exploration',title:'Start campus exploration',description:'Open or resume the local six-stop career story; does not answer questions or finish it.',inputSchema:schema,annotations:{readOnlyHint:false,untrustedContentHint:false},execute(args){check(args);if(state.finished)renderResults();else renderStory();return {view:state.view,step:state.step+1}}}]){try{Promise.resolve(ctx.registerTool(tool,{signal:life.signal})).catch(()=>{})}catch{}}window.addEventListener('pagehide',()=>life.abort(),{once:true})}

})();
</script>
